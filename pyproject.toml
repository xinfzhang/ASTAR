[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astar"
version = "1.0.0"
description = "ASTAR: Automatic Template Induction for Medical Report Structuring"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "ASTAR Team"}
]
keywords = ["medical-nlp", "template-induction", "report-structuring", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.2.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
eval = [
    "rouge_score>=0.1.2",
    "jieba>=0.42.1",
    "sacrebleu>=2.3.0",
    "bert-score>=0.3.13",
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
all = ["astar[eval,dev]"]

[project.urls]
Homepage = "https://github.com/your-org/astar"
Documentation = "https://github.com/your-org/astar#readme"
Repository = "https://github.com/your-org/astar.git"

[project.scripts]
astar-induction = "astar.induction.pipeline:main"
astar-structure = "astar.structuring.structure:main"
astar-eval = "astar.evaluation.run_eval:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["astar*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]
